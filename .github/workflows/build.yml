name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Release version: bump the major.minor here; the patch is the run number.
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Build macOS .app bundle
        if: matrix.os == 'macos-latest'
        run: ./scripts/build-macos-app.sh

  # Release installers are only built for pushes to main. They need the
  # bundled EVE SSO Client ID, which lives in the "release" environment's
  # default_clientid secret.
  package-windows:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Write .clientid
        shell: pwsh
        env:
          DEFAULT_CLIENTID: ${{ secrets.default_clientid }}
        run: |
          if (-not $env:DEFAULT_CLIENTID) { throw "default_clientid secret is not set in the release environment" }
          Set-Content -Path .clientid -Value $env:DEFAULT_CLIENTID -NoNewline -Encoding ascii
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/esi-proxy-*-windows-x64-setup.exe
          if-no-files-found: error

  package-macos:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Write .clientid
        env:
          DEFAULT_CLIENTID: ${{ secrets.default_clientid }}
        run: |
          if [[ -z "$DEFAULT_CLIENTID" ]]; then
            echo "::error::default_clientid secret is not set in the release environment"
            exit 1
          fi
          printf '%s' "$DEFAULT_CLIENTID" > .clientid
      - name: Build installer
        run: ./scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: dist/esi-proxy-*-macos-universal.dmg
          if-no-files-found: error

  release:
    needs: [package-windows, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of the same workflow run: replace the assets.
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "ESI Proxy ${VERSION}" \
              --generate-notes
          fi
